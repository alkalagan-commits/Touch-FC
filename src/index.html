<style>
/* Layout : une seule vue plein écran — tableau de score, pelouse, barre d'état ; menus et coupe dans un panneau par-dessus. Univers "feutrine de salon", un seul thème sombre. */
:root{
  --ink:#0f2016; --panel:#132a1c; --line:#35523f; --chalk:#f2efe4;
  --brass:#e0b54a; --muted:#9fb7a5; --ok:#5fbf7a; --warn:#d9a441; --bad:#d06a5a;
  --display:"Saira Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
:root{padding-top:0!important;padding-bottom:0!important;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)} /* la marge du haut est gérée par .app, pour que le score ne passe jamais sous l'heure et la batterie */
[hidden]{display:none!important}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;display:flex;flex-direction:column;gap:6px;padding-top:calc(var(--sat) + 1px)!important;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;padding-bottom:calc(var(--sab)*.08 + 1px)!important} /* chrono descendu au plus près de la barre d'accueil de l'iPhone */
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#roof,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.board{position:relative;z-index:2}
.overlay,.banner,.turn{z-index:3}
.app{position:relative;z-index:1}
.board{background:rgba(10,22,14,.84);border-radius:12px;padding:4px 6px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.team{display:flex;align-items:center;gap:7px;min-width:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.team .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team,.team.b{flex-direction:column;justify-content:center;text-align:center;gap:3px}
.team .fl{font-size:30px;line-height:1}
.team .nm{white-space:normal;text-wrap:balance;line-height:1.05;max-width:100%;overflow-wrap:anywhere}
.team.on{color:var(--chalk)}
.board{grid-template-columns:minmax(72px,1fr) minmax(0,auto) minmax(72px,1fr)!important}
.board .round{white-space:normal;text-wrap:balance;text-align:center;line-height:1.1}
.team .nm.code{font-weight:800;font-size:24px;letter-spacing:.06em;line-height:1;white-space:nowrap;overflow-wrap:normal;text-wrap:nowrap}
.team{padding:5px 6px;border-radius:10px;transition:background .25s,color .25s}
.team.on{background:rgba(224,181,74,.16);box-shadow:inset 0 0 0 1px rgba(224,181,74,.55)}
.turn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;
  background:var(--ink);border:2px solid var(--brass);border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 14px rgba(0,0,0,.5);animation:turnIn 1.3s ease forwards}
@keyframes turnIn{0%{opacity:0;transform:translate(-50%,-12px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}22%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
.chip{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.4)}
.team.on .chip{outline:2px solid var(--brass);outline-offset:2px}
.mid{order:2;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.score{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;
  background:#08130c;border:1px solid #2b4434;border-radius:6px;padding:2px 12px 4px;color:var(--brass)}
.half{font-family:var(--display);font-weight:600;font-size:13px;line-height:1;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;min-height:13px}
.clock{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.clock .t{font-weight:800;font-size:24px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;background:#08130c;border:1px solid #2b4434;border-radius:6px;padding:2px 9px 3px;color:var(--brass);transition:color .25s,border-color .25s}
.clock .t.low{color:var(--bad);border-color:var(--bad)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.msg{font-size:13px;color:var(--muted);min-width:0}
.msg b{color:var(--chalk);font-weight:600}
button{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:6px;color:var(--chalk)}
.ghost{background:none;border:1px solid var(--line);font-size:14px;padding:6px 12px;white-space:nowrap}
.msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,22,14,.74);padding:8px;box-sizing:border-box}
.card{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:20px 16px;width:min(380px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px;text-align:center;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card h1{font-family:var(--display);font-weight:800;font-size:42px;line-height:.92;margin:0;letter-spacing:.02em;text-wrap:balance}
.card h1 span{color:var(--brass)}
.card h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;text-align:left}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.big{background:var(--brass);color:#1b1405;border:0;font-size:20px;padding:12px}
.alt{background:none;border:1px solid var(--brass);color:var(--brass);font-size:18px;padding:10px}
.small{background:none;border:1px solid var(--line);font-size:14px;padding:8px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 10px}
.fixture .tm{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em}
.fixture .fl{font-size:34px;line-height:1}
.fixture .vs{font-family:var(--display);color:var(--muted);font-size:16px}
.picker{display:flex;flex-direction:column;gap:6px;text-align:left}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:9px 8px;font-family:var(--body);font-weight:600;letter-spacing:0;text-transform:none;font-size:13px;text-align:left;min-width:0}
.pick span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .f{font-size:20px;flex:none}
.pick.sel{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.slots{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center}
.pot{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left}
.slot{background:#08130c;border:1px solid #2b4434;border-radius:6px;padding:9px 10px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.03em;
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:28px;transition:background .25s,border-color .25s,color .25s}
.slot .f{font-size:20px}
.slot .v,#slG .v{display:inline-block}
.slot.roll .v,#slG.roll .v{animation:roll .09s linear}
.slot.hit{border-color:var(--brass)}
.slot.me{background:var(--brass);color:#1b1405}
#slG{display:inline-block;min-width:.8em;transition:color .25s}
@keyframes roll{from{transform:translateY(-35%);opacity:.4}to{transform:none;opacity:1}}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid #22392b;text-align:center}
.tbl th{font-family:var(--display);font-weight:600;letter-spacing:.1em;color:var(--muted);font-size:12px}
.tbl td.t{text-align:left;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.me td{color:var(--brass);font-weight:600}

.q.y{background:var(--ok)} .q.m{background:var(--warn)}

.res div.me{color:var(--brass);font-weight:600}
.res .l{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .r{text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .s{font-family:var(--display);font-weight:800;font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.res .s small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.note{font-size:12px;color:var(--muted)}
.trophy{font-size:56px;line-height:1}
.round{font-family:var(--display);font-weight:800;font-size:15px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.agg{font-family:var(--display);font-weight:800;font-size:16px;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--chalk)}
.clock.big{position:relative;z-index:2;cursor:pointer;align-self:center;font-size:16px;background:rgba(10,22,14,.84);border-radius:12px;padding:4px 10px}
.clock.big .t{font-size:40px;padding:3px 16px 5px}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-weight:800;font-size:60px;line-height:1;color:var(--brass);
  text-shadow:0 3px 0 #000;pointer-events:none;padding:0 12px}
.banner small{display:block;font-size:22px;color:var(--chalk);letter-spacing:.06em;margin-top:6px}
details.br{text-align:left;border-top:1px solid #22392b}
details.br summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 2px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
details.br summary::-webkit-details-marker{display:none}
details.br summary::after{content:'+';font-size:18px;color:var(--brass)}
details.br[open] summary::after{content:'–'}
.res div.ch .w{color:var(--brass)}
.res .w{color:var(--chalk);font-weight:600}
.res .lo{opacity:.55}
.path{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.5;color:var(--muted);text-align:left}
.path b{color:var(--chalk);font-weight:600}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

  if(!inCup())return T[t][4];

function drawR32(pots){
  // un du chapeau 1 contre un du chapeau 2 ; on évite deux équipes de la même confédération (sauf l'UEFA, trop nombreuse)
  for(let tries=0;tries<5000;tries++){
    const b=shuffle(pots[1]);

}

}

  if(dist>H/2)return 0;return dist<ZONE?.6+.4*(1-dist/ZONE):.6*(1-(dist-ZONE)/(H/2-ZONE))}

function chant(){

    if(s[0]==='d'||s[0]==='h'){drum(t+s[1],1,s[0]==='h');end=Math.max(end,t+s[1]+.3);continue}

  if(b.gk){ // le gardien reste dans sa surface, mais peut franchir sa ligne et entrer dans sa cage (rebond sur les filets)
    const red=b.team==='r',lo=W/2-GOAL/2+b.r,hi=W/2+GOAL/2-b.r,mouth=b.x>=lo&&b.x<=hi;
    if(b.x<BOX.x0+b.r){b.x=BOX.x0+b.r;b.vx=Math.abs(b.vx)*.5} if(b.x>BOX.x1-b.r){b.x=BOX.x1-b.r;b.vx=-Math.abs(b.vx)*.5}
    const yMin=red?H-BOX.d+b.r:(mouth?-GD+b.r:b.r),yMax=red?(mouth?H+GD-b.r:H-b.r):BOX.d-b.r;
    if(b.y<yMin){b.y=yMin;b.vy=Math.abs(b.vy)*(red?.5:.3);if(!red&&mouth)netHit(0)}
    if(b.y>yMax){b.y=yMax;b.vy=-Math.abs(b.vy)*(red&&mouth?.3:.5);if(red&&mouth)netHit(1)}
    if(red?b.y>H-b.r:b.y<b.r){ // dans la cage : filets latéraux
      if(b.x<lo){b.x=lo;b.vx=Math.abs(b.vx)*.3} if(b.x>hi){b.x=hi;b.vx=-Math.abs(b.vx)*.3}}
    for(const p of posts){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),min=b.r+4;
      if(d<min&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*min;b.y=p.y+ny*min;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny}}}
    return;
  }
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.7;sfx.board(Math.abs(b.vx))}
  if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.7;sfx.board(Math.abs(b.vx))}
  const inMouth=b.ball&&Math.abs(b.x-W/2)<GOAL/2;
  if(!inMouth){
    if(b.y<b.r && !(b.ball&&b.y<0)){b.y=b.r;b.vy=Math.abs(b.vy)*.7;sfx.board(Math.abs(b.vy))}
    if(b.y>H-b.r && !(b.ball&&b.y>H)){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.7;sfx.board(Math.abs(b.vy))}
  }
  if(b.ball){
    if(b.y<0||b.y>H){
      const lo=W/2-GOAL/2+b.r, hi=W/2+GOAL/2-b.r;
      // dans la cage, le filet amortit : le ballon freine, s'enfonce dans les mailles qui se tendent puis le retiennent
      b.vx*=.992;b.vy*=.992;

      if(b.x<lo){if(b.vx<-1)netHit(gi);b.vx=b.vx*.55+(lo-b.x)*.18;b.vy*=.9;if(b.x<lo-NET*.6){b.x=lo-NET*.6;b.vx=Math.max(0,b.vx)}}
      if(b.x>hi){if(b.vx>1)netHit(gi);b.vx=b.vx*.55-(b.x-hi)*.18;b.vy*=.9;if(b.x>hi+NET*.6){b.x=hi+NET*.6;b.vx=Math.min(0,b.vx)}}
      const back=gi?H+GD-b.r:-GD+b.r,dep=gi?b.y-back:back-b.y; // de combien le ballon enfonce le filet du fond
      if(dep>0){if(Math.abs(b.vy)>1)netHit(gi);const s=gi?-1:1;b.vy=b.vy*.55+s*dep*.18;b.vx*=.9;
        if(dep>NET){b.y=back-s*NET;b.vy=s>0?Math.max(0,b.vy):Math.min(0,b.vy)}}
    }
    for(const p of posts){
      const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),min=b.r+4;
      if(d<min&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*min;b.y=p.y+ny*min;
        const vn=b.vx*nx+b.vy*ny; if(vn<0){b.vx-=1.8*vn*nx;b.vy-=1.8*vn*ny;sfx.post(-vn)}}
    }
  }
}
function collide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
  if(d>=min||d===0)return;

  a.x-=nx*ov*b.m/tm;a.y-=ny*ov*b.m/tm;b.x+=nx*ov*a.m/tm;b.y+=ny*ov*a.m/tm;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv>0)return;
  if(phase==='moving'&&(a.ball||b.ball)){const bl=a.ball?a:b,k=a.ball?b:a; // tir sur le gardien adverse : le ballon fonçait vers sa cage
    if(k.gk&&k.team!==turn&&(k.team==='b'?-bl.vy:bl.vy)>4)saveAt=performance.now()}
  const hitter=a.ball?b:b.ball?a:(Math.hypot(a.vx,a.vy)>=Math.hypot(b.vx,b.vy)?a:b); // le joueur qui frappe
  const j=-(1+.88)*rv/(1/a.m+1/b.m);
  a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;b.vx+=j*nx/b.m;b.vy+=j*ny/b.m;
  if(sixShot&&(a.ball||b.ball)&&hitter.gk){sixShot=false;const bl=a.ball?a:b;bl.vx*=1.07;bl.vy*=1.07} // dégagement du gardien : le ballon part beaucoup plus loin
  hitter.vx*=.5;hitter.vy*=.5; // après avoir touché le ballon ou un joueur, sa vitesse est divisée par 2
  if(a.ball||b.ball)sfx.kick(-rv);else sfx.clack(-rv);
  if(a.ball){lastTouch=b.team;lastDisc=b} else if(b.ball){lastTouch=a.team;lastDisc=a}
  if((a.ball||b.ball)&&phase==='moving'&&lastTouch!==turn)oppTouch=true; // même un rebond très bref sur un adversaire annule le droit de rejouer
  if(kickShot&&(a.ball||b.ball))kickTouched=true; // engagement : on peut jouer le ballon dans toutes les directions, même en avant
}
function step(){
  const all=bodies(),N=4;
  for(let s=0;s<N;s++){
    for(const b of all){b.x+=b.vx/N;b.y+=b.vy/N;walls(b)}
    for(let i=0;i<all.length;i++)for(let k=i+1;k<all.length;k++)collide(all[i],all[k]);
  }
  for(const b of all){ // joueurs : frottement + résistance au roulement ; ballon : glisse d'origine (simple frottement, sans résistance au roulement)
    const sp=Math.hypot(b.vx,b.vy);if(sp>0){const ns=Math.max(0,sp*(b.ball?FRB:FR)-(b.ball?(wx.rain?DB*.9:DB):DD));b.vx*=ns/sp;b.vy*=ns/sp}
   if(Math.hypot(b.vx,b.vy)<.07){b.vx=0;b.vy=0}}
}

const CORNER=60;

const STUCK_NEAR=BR+18,STUCK_PX=5;
/* Le but est-il possible ? Il faut un joueur de l'équipe qui puisse atteindre le ballon par derrière sans être gêné,
   le frapper avec un angle jouable, assez fort pour qu'il aille jusqu'au but, et un couloir libre (gardien compris) jusqu'à la cage. */
function canScore(team){
  if(team==='r'?ball.y>=H/2:ball.y<=H/2)return false; // pas de SHOOT ! tant que le ballon n'est pas dans le camp adverse
  const gy=team==='r'?-12:H+12,fr=wx.rain?DB*.9:DB;
  const segClear=(x0,y0,x1,y1,rad,skip)=>{const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy||1;
    for(const o of discs){if(skip.includes(o))continue;const t=Math.max(0,Math.min(1,((o.x-x0)*dx+(o.y-y0)*dy)/l2));if(Math.hypot(x0+dx*t-o.x,y0+dy*t-o.y)<rad)return false}return true};
  const ballTravel=v=>{let d=0;while(v>.07){d+=v;v=Math.max(0,v*FRB-fr)}return d};
  const discAt=(v,s)=>{let d=0;while(d<s&&v>.07){d+=v;v=Math.max(0,v*FR-DD)}return d>=s?v:0};
  for(const o of [-70,-48,-24,0,24,48,70]){
    const tx=W/2+o,ul=Math.hypot(tx-ball.x,gy-ball.y)||1,ux=(tx-ball.x)/ul,uy=(gy-ball.y)/ul;
    if(!segClear(ball.x,ball.y,tx,gy,R+BR-2,[]))continue;                                  // un joueur bouche la trajectoire du ballon
    const px=ball.x-ux*(R+BR-3),py=ball.y-uy*(R+BR-3);                                     // point d'impact, derrière le ballon
    for(const d of discs){
      if(d.team!==team)continue;

      if(cos<.35)continue;                                                                  // angle de frappe trop fermé
      const tEnd=Math.max(0,1-(R+BR+2)/dist),t=Math.max(0,Math.min(tEnd,((ball.x-d.x)*dx+(ball.y-d.y)*dy)/(dist*dist)));

      if(!segClear(d.x,d.y,px,py,R*2-2,[d]))continue;                                       // un joueur gêne sa course
      if(ballTravel(1.39*cos*discAt(MAXV,dist))>=ul+4)return true;                         // assez de puissance pour atteindre le but
    }
  }

}
const inShootPos=team=>ball.x>BOX.x0&&ball.x<BOX.x1&&(team==='r'?ball.y<BOX.d:ball.y>H-BOX.d); // position de marquer : ballon dans la surface de réparation adverse
function endPossession(team){ // team : l'équipe dont la possession se termine. Renvoie true si l'arbitre siffle le renvoi
  const nearEnd=(ball.y<=STUCK_NEAR||ball.y>=H-STUCK_NEAR)&&Math.abs(ball.x-W/2)>GOAL/2;
  const moved=possPos?Math.hypot(ball.x-possPos.x,ball.y-possPos.y):1e9;
  stuckRun=nearEnd&&moved<STUCK_PX?stuckRun+1:0;
  if(stuckRun>=2){stuckRun=0;lineRun=0;sixMeters();return true}
  const end=ball.y<=ball.r+6?-1:ball.y>=H-ball.r-6?1:0;
  if(!end){lineRun=0;return false}
  const att=end<0?'r':'b'; // les Rouges attaquent le but du haut, les Bleus celui du bas
  if(lineRun&&lineEnd===end)lineRun++;else lineRun=team===att?1:0;
  lineEnd=end;
  if(lineRun>=3){lineRun=0;sixMeters();return true}

function sixMeters(title){ // l'arbitre siffle un renvoi aux 6 mètres pour l'équipe qui défend ce but

  phase='goal';aim=null;sfx.whistle('kick');banner(title||'RENVOI AU GARDIEN',`Dégagement du gardien · ${S[def].name}`);ui();
  setTimeout(()=>{
    $('banner').hidden=true;
    ball.x=W/2+(left?-55:55);ball.y=top?52:H-52;ball.vx=ball.vy=0;
    discs=[...formation('r'),...formation('b')]; // les deux équipes se replacent en position défensive
    const g=discs.find(d=>d.team===def&&d.gk);g.x=ball.x;g.y=top?ball.y-(R+BR+6):ball.y+(R+BR+6); // le gardien se place derrière le ballon

    opp.x=ball.x; // l'adversaire le plus proche garde sa hauteur mais se place dans l'axe du ballon : sur la trajectoire d'un dégagement tout droit

  },1600);

/* Célébration d'un but : le buteur file vers le coin, ses coéquipiers viennent le féliciter,
   puis tout le monde regagne sa position de départ. Coup d'envoi 5 secondes (300 images) après le but. */
let goalCel=null;
const GC_BACK=170,GC_END=300;
function startGoalCel(team){
  for(const d of discs){d.vx=d.vy=0;delete d.path;d.star=false;d.ret=false}
  const mine=discs.filter(d=>d.team===team),sc=lastDisc&&lastDisc.team===team?lastDisc:mine[4];
  const cy=team==='r'?62:H-62,cx=sc.x<W/2?62:W-62,base=Math.atan2(H/2-cy,W/2-cx);
  sc.path=[{x:cx,y:cy}];sc.delay=0;sc.spd=6;sc.star=true;
  mine.filter(d=>d!==sc).forEach((d,i)=>{const a=base+[-1.15,-.38,.38,1.15][i];d.path=[{x:cx+Math.cos(a)*58,y:cy+Math.sin(a)*58}];d.delay=10+i*6;d.spd=8;d.ph=i*9});
  goalCel={team,t:0};
}
function goalCelStep(){
  const g=goalCel;g.t++;
  for(const d of discs){
    if(!d.path)continue;if(d.delay>0){d.delay--;continue}
    const p=d.path[0];if(!p)continue;const dx=p.x-d.x,dy=p.y-d.y,l=Math.hypot(dx,dy);
    if(l<=d.spd){d.x=p.x;d.y=p.y;d.path.shift()}else{d.x+=dx/l*d.spd;d.y+=dy/l*d.spd}
  }
  if(g.t===GC_BACK){ // tout le monde se replace pour l'engagement
    const tgt=[...formation('r'),...formation('b')];kickoffPlace(tgt);
    discs.forEach((d,i)=>{const t=tgt[i],l=Math.hypot(t.x-d.x,t.y-d.y);d.path=[{x:t.x,y:t.y}];d.delay=0;d.spd=Math.max(1,l/105);d.star=false;d.ret=true});
    ball.x=W/2;ball.y=H/2;ball.vx=ball.vy=0;
  }
  if(g.t>=GC_END){goalCel=null;for(const d of discs){delete d.path;d.ret=false}reset();setAim();sfx.whistle('kick')}
}
function stepBall(){ // pendant la fête, seul le ballon finit sa course dans le filet
  for(let s=0;s<4;s++){ball.x+=ball.vx/4;ball.y+=ball.vy/4;walls(ball)}
  const sp=Math.hypot(ball.vx,ball.vy);if(sp>0){const ns=Math.max(0,sp*FRB-DB);ball.vx*=ns/sp;ball.vy*=ns/sp}if(Math.hypot(ball.vx,ball.vy)<.07)ball.vx=ball.vy=0;
}
let flip=false; // 2e mi-temps : changement de côté. L'équipe du joueur reste en bas de l'écran : c'est le stade (tunnel, tribunes) qui tourne autour

    banner('PROLONGATION',`But en or · tirage au sort : engagement ${S[ko].flag?S[ko].flag+' ':''}${S[ko].name}`);ui();
    setTimeout(()=>{$('banner').hidden=true;kickoff=ko;reset();shownTurn=null;setAim();sfx.whistle('kick')},2600);

function endMatch(){
  clearLive();
  sfx.whistle('end');
  setTimeout(()=>{const a=match.agg||[0,0];score.r+a[0]!==score.b+a[1]?sfx.roar(true):sfx.applause()},1500); // vainqueur : clameur de but ; nul : applaudissements
  goalRoll=false;phase='over';aim=null;
  const ag=match.agg,clKo=mode==='cl'&&cl&&cl.stage!=='league'&&cl.stage!=='final',leg1=clKo&&cl.leg===1;
  const tr=score.r+(ag?ag[0]:0),tb=score.b+(ag?ag[1]:0); // match retour : c'est le qualifié (cumul des deux matchs) qui célèbre
  const w=tr>tb?'r':tr<tb?'b':null;

  if(w)celebrate(w,after,{noFw:leg1,title:ag?'QUALIFIÉ !':leg1?'FIN DU MATCH ALLER':'VICTOIRE !'}); // match aller : pas de feux d'artifice
  else{banner('MATCH NUL',scoreTxt());ui();setTimeout(()=>{$('banner').hidden=true;after()},2200)}
}
function maybeCpu(){if(cpu&&turn==='b'&&phase==='aim')setTimeout(cpuShot,650)}
function cpuShot(){
  if(phase!=='aim'||turn!=='b')return;
  if(sixFresh){ // 6 mètres : le gardien de l'IA dégage le plus loin possible vers l'avant
    const k=discs.find(d=>d.team==='b'&&d.gk);
    const tx=ball.x+(Math.random()-.5)*30,ty=H-120, // dégagement bien droit, dans le couloir libre : toujours réussi
          ux=tx-ball.x,uy=ty-ball.y,ul=Math.hypot(ux,uy);
    const px=ball.x-ux/ul*(R+BR-3),py=ball.y-uy/ul*(R+BR-3),dx=px-k.x,dy=py-k.y,dl=Math.hypot(dx,dy),v=MAXV;
    shoot(k,dx/dl*v,dy/dl*v);return;
  }
  if(kickFresh){ // engagement : l'IA joue vers l'avant, en diagonale pour éviter le milieu adverse collé au rond
    const k=discs.filter(d=>d.team==='b').sort((x,y)=>Math.hypot(x.x-ball.x,x.y-ball.y)-Math.hypot(y.x-ball.x,y.y-ball.y))[0];
    const tx=W/2+(Math.random()<.5?-1:1)*(140+Math.random()*60),ty=ball.y+260,ux=tx-ball.x,uy=ty-ball.y,ul=Math.hypot(ux,uy);
    const px=ball.x-ux/ul*(R+BR-3),py=ball.y-uy/ul*(R+BR-3),dx=px-k.x,dy=py-k.y,dl=Math.hypot(dx,dy),v=9+Math.random()*3;
    shoot(k,dx/dl*v,dy/dl*v);return;
  }
  /* ---- IA : elle cherche toujours la meilleure action pour marquer ou défendre ; seule sa précision dépend de son niveau ---- */
  const ballInBox=ball.y<BOX.d&&ball.x>BOX.x0&&ball.x<BOX.x1;
  const mine=discs.filter(d=>d.team==='b'&&(!d.gk||ballInBox));
  const segHits=(x0,y0,x1,y1,rad,skip)=>{let n=0;const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy||1;
    for(const o of discs){if(skip.includes(o))continue;const t=Math.max(0,Math.min(1,((o.x-x0)*dx+(o.y-y0)*dy)/l2));
      if(Math.hypot(x0+dx*t-o.x,y0+dy*t-o.y)<rad)n+=o.gk&&o.team==='r'?2:1}return n};
  const ballTravel=vb=>{let v=vb,d=0;while(v>.07){d+=v;v=Math.max(0,v*FRB-DB)}return d};
  const discAt=(v0,s)=>{let v=v0,d=0;while(d<s&&v>.07){d+=v;v=Math.max(0,v*FR-DD)}return d>=s?v:0};
  function gift(ux,uy,len,shooterDisc){ // coût d'un ballon qui finit au pied d'un adversaire, surtout devant notre but
    let x=ball.x,y=ball.y,vx=ux,vy=uy,left=len;            // trajet du ballon, rebonds sur les côtés compris
    while(left>0){const st=Math.min(8,left);x+=vx*st;y+=vy*st;left-=st;
      if(x<BR){x=2*BR-x;vx=-vx}if(x>W-BR){x=2*(W-BR)-x;vx=-vx}if(y<BR||y>H-BR)break}
    let opp=1e9,own=1e9;
    for(const o of discs){const dd=Math.hypot(o.x-x,o.y-y);if(o.team==='r')opp=Math.min(opp,dd);else if(o!==shooterDisc)own=Math.min(own,dd)}
    if(opp>R+BR+110||own<opp-20)return 0;                  // personne de l'adversaire pour le récupérer, ou un des nôtres plus près
    const close=1-Math.min(1,Math.max(0,opp-(R+BR))/110);   // 1 = ballon collé à un adversaire
    const danger=y<ZONE?3:y<H/2?1.6:.6;                     // dans la zone de tir adverse : cadeau mortel
    return Math.round(close*danger*260);
  }
  function plan(T,kind){ // meilleur joueur pour envoyer le ballon vers T
    let best=null;const ul=Math.hypot(T.x-ball.x,T.y-ball.y)||1,ux=(T.x-ball.x)/ul,uy=(T.y-ball.y)/ul;
    const px=ball.x-ux*(R+BR-3),py=ball.y-uy*(R+BR-3);
    for(const d of mine){
      const dx=px-d.x,dy=py-d.y,dist=Math.hypot(dx,dy)||1;
      const tEnd=Math.max(0,1-(R+BR+2)/dist),t=Math.max(0,Math.min(tEnd,((ball.x-d.x)*dx+(ball.y-d.y)*dy)/(dist*dist)));
      if(Math.hypot(d.x+dx*t-ball.x,d.y+dy*t-ball.y)<R+BR-1)continue;          // toucherait le ballon du mauvais côté
      const cos=(dx*ux+dy*uy)/dist;if(cos<.35)continue;                            // angle de frappe trop fermé
      let cost=dist*.6+(1-cos)*400+segHits(d.x,d.y,px,py,R*2,[d,ball])*350;       // chemin du joueur
      cost+=segHits(ball.x,ball.y,T.x,T.y,R+BR+2,[d,ball])*(kind==='shot'?450:250); // chemin du ballon
      // puissance : à fond pour tirer ou dégager, dosée pour avancer
      let v=MAXV;
      if(kind==='pass'){let lo=4,hi=MAXV;for(let i=0;i<14;i++){const m=(lo+hi)/2;ballTravel(1.39*cos*discAt(m,dist))<ul?lo=m:hi=m}v=Math.min(MAXV,hi*1.05)}
      if(kind==='shot'&&ballTravel(1.39*cos*discAt(MAXV,dist))<ul-20)cost+=900;   // tir trop court
      if(kind!=='shot')cost+=gift(ux,uy,ballTravel(1.39*cos*discAt(v,dist)),d);     // ne pas offrir le ballon à l'adversaire
      if(!best||cost<best.cost)best={d,dx,dy,dist,cost,v,kind};
    }
    return best;
  }
  const opts=[];
  const oppGk=discs.find(o=>o.team==='r'&&o.gk),gkSide=oppGk&&oppGk.x<W/2?1:-1;
  // 1. marquer : plusieurs cibles dans le but, de préférence loin du gardien
  if(H-ball.y<460)for(const o of [-64,-34,0,34,64]){const p=plan({x:W/2+o,y:H+12},'shot');if(p){p.cost+=(o*gkSide<0?160:0)-300;opts.push(p)}}
  const threat=ball.y<430; // le ballon est à portée de tir de l'adversaire
  // 2. défendre en dégageant le ballon loin de sa cage, sur un côté
  if(threat)for(const cx of [W*.12,W*.88,W*.5]){const p=plan({x:cx,y:Math.min(H-60,ball.y+420)},'clear');if(p){p.cost+=cx===W*.5?120:0;opts.push(p)}}
  // 3. avancer vers le couloir le moins défendu
  for(const cx of [W*.2,W*.5,W*.8])for(const dy of [180,300,420]){const p=plan({x:cx,y:Math.min(H-150,ball.y+dy)},'pass');if(p){p.cost+=200+(dy===300?0:40);opts.push(p)}}
  opts.sort((a,b)=>a.cost-b.cost);
  let pick=opts[0];
  // 4. si la menace est réelle et qu'aucune action sûre n'existe : couper la route du but (gardien d'abord, puis un défenseur)
  if(threat&&(!pick||pick.cost>950)){
    const gx=W/2,gy=8,bl=Math.hypot(gx-ball.x,gy-ball.y)||1;
    const myGk=discs.find(d=>d.team==='b'&&d.gk);
    const gT={x:Math.max(BOX.x0+R,Math.min(BOX.x1-R,gx+(ball.x-gx)*40/Math.max(40,ball.y))),y:40};
    const moves=[];
    if(myGk&&Math.hypot(myGk.x-gT.x,myGk.y-gT.y)>28)moves.push({d:myGk,x:gT.x,y:gT.y});
    const k=Math.min(140,bl*.5);moves.push(...discs.filter(d=>d.team==='b'&&!d.gk).map(d=>({d,x:ball.x+(gx-ball.x)/bl*k,y:Math.max(R+2,ball.y+(gy-ball.y)/bl*k)})));
    let mv=null;
    for(const m of moves){const dx=m.x-m.d.x,dy=m.y-m.d.y,dl=Math.hypot(dx,dy)||1,t=Math.max(0,Math.min(1,((ball.x-m.d.x)*dx+(ball.y-m.d.y)*dy)/(dl*dl)));
      if(dl<20||Math.hypot(m.d.x+dx*t-ball.x,m.d.y+dy*t-ball.y)<R+BR+4)continue;
      const c=m.d.gk?0:dl;if(!mv||c<mv.c)mv={...m,dx,dy,dl,c}}
    if(mv){const v=Math.min(MAXV*.8,Math.sqrt(mv.dl/.97));shoot(mv.d,mv.dx/mv.dl*v,mv.dy/mv.dl*v);return}
  }
  if(!pick){ // rien de jouable : se replacer à côté du ballon sans le toucher
    const d=discs.filter(d=>d.team==='b'&&!d.gk).sort((x,y)=>Math.hypot(x.x-ball.x,x.y-ball.y)-Math.hypot(y.x-ball.x,y.y-ball.y))[0];
    const sx=d.x<ball.x?-1:1,lx=Math.max(R,Math.min(W-R,ball.x+sx*(R+BR+22))),ly=Math.max(R,ball.y-(R+BR));
    const dx=lx-d.x,dy=ly-d.y,dl=Math.hypot(dx,dy)||1,v=Math.min(MAXV*.6,Math.sqrt(dl/.97));
    shoot(d,dx/dl*v,dy/dl*v);return;
  }
  // précision selon le niveau de l'équipe (et plus prudente devant sa propre cage)
  const lvl=S.b.skill||.14,noise=lvl*.42*(ball.y<260?.5:1);
  const a=Math.atan2(pick.dy,pick.dx)+(Math.random()-.5)*2*noise,v=pick.v*(1+(Math.random()-.5)*lvl*.5);
  shoot(pick.d,Math.cos(a)*Math.min(MAXV,v),Math.sin(a)*Math.min(MAXV,v));
}

/* ---------- Fête de fin de match ---------- */
function celebrate(team,cb,o={}){
  phase='over';
  const mine=discs.filter(d=>d.team===team);
  const sc=mine[lastScorer[team]]||mine[3];
  const cy=team==='r'?72:H-72;
  const cx=sc.x<W/2?72:W-72;
  const base=Math.atan2(H/2-cy,W/2-cx);
  sc.path=[{x:cx,y:cy}];sc.delay=0;sc.spd=5.5;sc.star=true;
  mine.filter(d=>d!==sc).forEach((d,i)=>{
    const a=base+[-1.15,-.38,.38,1.15][i];
    d.path=[{x:cx+Math.cos(a)*66,y:cy+Math.sin(a)*66}];d.delay=22+i*9;d.spd=4.2;d.ph=i*9;
  });
  discs.filter(d=>d.team!==team).sort((a,b)=>Math.hypot(a.x,a.y-H/2)-Math.hypot(b.x,b.y-H/2)).forEach((d,i)=>{
    d.path=flip?[{x:W-34,y:H/2+(d.y<H/2?-12:12)},{x:W+M+40,y:H/2}]:[{x:34,y:H/2+(d.y<H/2?-12:12)},{x:-M-40,y:H/2}];d.delay=30+i*26;d.spd=2;d.loser=true;
  });
  celeb={team,t:0,noFw:!!o.noFw};confetti=[];fireworks=[];sparks=[];ui();
  banner(o.title||'VICTOIRE !',mode==='cup'||mode==='cl'?`${S[team].flag||S[team].crest||''} ${S[team].name}`:'');
  setTimeout(()=>{$('banner').hidden=true;if(phase==='over')cb()},5200);
}
function animStep(){
  celeb.t++;
  for(const d of discs){
    if(!d.path)continue; if(d.delay>0){d.delay--;continue}
    const p=d.path[0];if(!p)continue;
    const dx=p.x-d.x,dy=p.y-d.y,l=Math.hypot(dx,dy);
    if(l<=d.spd){d.x=p.x;d.y=p.y;d.path.shift()}else{d.x+=dx/l*d.spd;d.y+=dy/l*d.spd}
  }
  // feux d'artifice : des fusées partent du rebord du toit et éclatent au-dessus de la pelouse, aux couleurs du vainqueur
  if(!celeb.noFw&&celeb.t>20&&celeb.t<400&&Math.random()<.09){
    const s=S[celeb.team],a=Math.random()*Math.PI*2,c=Math.cos(a),sn=Math.sin(a),R0=ROOF;
    const x0=W/2+R0.A*Math.sign(c)*Math.pow(Math.abs(c),2/R0.N),y0=H/2+R0.B*Math.sign(sn)*Math.pow(Math.abs(sn),2/R0.N);
    const pal=[['#e0b54a','#fff3c4'],[s.main,s.main],[s.sec,s.sec],['#f2efe4','#ffffff']][(Math.random()*4)|0];
    sfx.launch();fireworks.push({x0,y0,x:x0,y:y0,tx:60+Math.random()*(W-120),ty:90+Math.random()*(H-180),t:0,dur:38+Math.random()*22,pal,two:Math.random()<.35?s.sec:null});
  }
  for(const f of fireworks){
    f.t++;const k=Math.min(1,f.t/f.dur),e=1-Math.pow(1-k,2.2);f.x=f.x0+(f.tx-f.x0)*e;f.y=f.y0+(f.ty-f.y0)*e;
    if(k>=1&&!f.done){f.done=true;f.flash=10;sfx.boom();
      const n=46+((Math.random()*24)|0);
      for(let i=0;i<n;i++){const an=i/n*Math.PI*2+Math.random()*.15,v=3+Math.random()*3.8;
        sparks.push({x:f.x,y:f.y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:60+Math.random()*30,max:90,c:f.two&&i%2?f.two:f.pal[i%2]})}}
    if(f.flash)f.flash--;
  }
  fireworks=fireworks.filter(f=>!f.done||f.flash>0);
  for(const p of sparks){p.x+=p.vx;p.y+=p.vy;p.vx*=.955;p.vy*=.955;p.life--}
  sparks=sparks.filter(p=>p.life>0);
}

/* ---------- Coupe du monde ---------- */
const KEY='touchfc-cup-v2';
function saveCup(){try{cup?localStorage.setItem(KEY,JSON.stringify(cup)):localStorage.removeItem(KEY)}catch(_){}}
function loadCup(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(_){return null}}
cup=loadCup();if(cup&&(!cup.ko&&cup.stage!=='done'||cup.host===undefined))cup=null;

function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function sim(a,b,ko){
  const d=elo(a)-elo(b);
  const r={a,b,ga:poisson(1.25*Math.exp(d/700)),gb:poisson(1.25*Math.exp(-d/700))};
  if(ko&&r.ga===r.gb){const pa=1/(1+Math.pow(10,-d/400));if(Math.random()<pa)r.ga++;else r.gb++;r.ap=1}
  return r;
}
function rank(x,y){return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||elo(y.t)-elo(x.t)}
function newCup(me){
  const host=pickHost(),pots=makePots(host,me);
  cup={me,host,pots,stage:'r32',ko:drawR32(pots),last:[],lastLabel:'',out:null,champ:null};
  saveCup();showReveal();
}
function nextOpp(){
  const p=cup.ko.find(p=>p.includes(cup.me));return p?(p[0]===cup.me?p[1]:p[0]):null;
}
function playRound(mine){
  const me=cup.me,res=[];
  const st=cup.stage,winners=[];
  for(const [a,b] of cup.ko){
    let r;
    if(mine&&(a===me||b===me)){r=a===me?{a,b,ga:mine[0],gb:mine[1]}:{a,b,ga:mine[1],gb:mine[0]};if(mine[2])r.ap=1}
    else r=sim(a,b,true);
    res.push(r);winners.push(r.ga>r.gb?a:b);
    const w=r.ga>r.gb?a:b;cup.boost=cup.boost||{};cup.boost[w]=(cup.boost[w]||0)+BOOST;
  }
  cup.hist=cup.hist||{};cup.hist[st]=res;
  if(!cup.out&&cup.ko.some(p=>p.includes(me))&&!winners.includes(me))cup.out=st;
  if(st==='final'){cup.champ=winners[0];cup.stage='done'}
  else{cup.ko=[];for(let i=0;i<winners.length;i+=2)cup.ko.push([winners[i],winners[i+1]]);cup.stage=STAGES[STAGES.indexOf(st)+1]}
  return {res,label:STAGE_NAME[st]};
}
function afterCupMatch(){
  const {res,label}=playRound([score.r,score.b,match.golden?1:0]);
  cup.last=res;cup.lastLabel=label;
  while(cup.out&&cup.stage!=='done')playRound(null); // on va au bout pour connaître le champion
  saveCup();mode='cup-hub';showHub();
}
function startCupMatch(){
  const me=cup.me,op=nextOpp(),A=T[me],B=T[op];
  setTeams(me,op);
  mode='cup';cpu=true;match={elapsed:0,golden:false,ko:true};
  begin();
}
/* Écusson générique des clubs : pas de logo officiel (protégé), mais un même blason pour tous,
   aux couleurs du club, avec son abréviation */
function crest(t){
  const r=T[t],m=r[2],s=r[3],[R,G,B]=rgb(m),ink=(R*.3+G*.59+B*.11)>150?'#111':'#fff';
  return `<svg viewBox="0 0 40 46" width="1.05em" height="1.2em" style="vertical-align:-.22em" aria-label="${r[0]}"><path d="M4 3h32v19c0 12-8 18-16 22C12 40 4 34 4 22z" fill="${m}" stroke="${s}" stroke-width="2.5"/><path d="M5.2 4.2h29.6v8H5.2z" fill="${s}"/><text x="20" y="33" text-anchor="middle" font-family="Saira Extra Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="${r[9].length>2?13:15}" fill="${ink}">${r[9]}</text></svg>`;
}
const ctn=t=>`${crest(t)} ${T[t][0]}`;
/* ---------- CHAMP LEAGUE : sur le modèle de la Ligue des champions (formule depuis 2024-25) ----------
   36 clubs, phase de ligue en un seul classement : 8 matchs contre 8 adversaires différents (2 par chapeau).
   1er à 8e : directement en huitièmes ; 9e à 24e : barrages ; 25e à 36e : éliminés.
   Barrages, huitièmes, quarts et demies en aller-retour (cumul des buts, but en or au retour si égalité) ; finale sur un match. */
const CL_KEY='touchfc-cl-v1';
const SHORT_NAME={r32:'16e de finale',r16:'8e de finale',qf:'Quarts de finale',sf:'Demi-finales',final:'Finale',po:'Barrages',league:'Phase de ligue'}; // libellés courts sous le score
const LEG_SHORT={po:'Barrages',r16:'8e',qf:'Quarts',sf:'Demies'}; // aller-retour : « 8e retour », pour tenir sur une ligne
const CL_STAGES=['po','r16','qf','sf','final'];
const CL_NAME={league:'Phase de ligue',po:'Barrages',r16:'Huitièmes de finale',qf:'Quarts de finale',sf:'Demi-finales',final:'Finale'};
const CL_ELIM={league:'en phase de ligue',po:'en barrages',r16:'en huitièmes de finale',qf:'en quarts de finale',sf:'en demi-finale',final:'en finale'};
const CLUB_IDS=[...Array(T.length-NAT).keys()].map(i=>NAT+i);
const ctry=t=>T[t][8];
let cl=null,clView='mine';
function saveCl(){try{cl?localStorage.setItem(CL_KEY,JSON.stringify(cl)):localStorage.removeItem(CL_KEY)}catch(_){}}
try{const s=localStorage.getItem(CL_KEY);cl=s?JSON.parse(s):null;if(cl&&!cl.pots)cl=null}catch(_){cl=null}
function clDraw(me){ // tirage : 4 chapeaux de 9 au classement ; 2 adversaires par chapeau, jamais un club du même pays
  const ord=CLUB_IDS.slice().sort((x,y)=>T[y][4]-T[x][4]),pots=[0,1,2,3].map(p=>shuffle(ord.slice(p*9,p*9+9)));
  const fx=[];
  for(let i=0;i<4;i++)for(let j=i;j<4;j++){
    let best=null;
    for(let tries=0;tries<400;tries++){
      const A=pots[i],B=i===j?A:shuffle(pots[j]),pairs=[];
      if(i===j){const c=shuffle(A);for(let k=0;k<9;k++)pairs.push([c[k],c[(k+1)%9]])}       // même chapeau : un cycle, 2 adversaires chacun
      else for(let k=0;k<9;k++){pairs.push([A[k],B[k]]);pairs.push([A[k],B[(k+1)%9]])}       // deux chapeaux : chacun en affronte 2 de l'autre
      const bad=pairs.filter(([a,b])=>ctry(a)===ctry(b)).length;
      if(!best||bad<best.bad)best={pairs,bad};if(!bad)break;
    }
    fx.push(...best.pairs.map(([a,b])=>({a,b})));
  }
  for(const f of fx)if(Math.random()<.5)[f.a,f.b]=[f.b,f.a]; // qui reçoit
  cl={me,pots,fx,stage:'league',md:0,ko:null,leg:1,first:null,last:[],lastLabel:'',out:null,champ:null};
  clView='mine';saveCl();
}
function clTable(){
  const rows=CLUB_IDS.map(t=>({t,j:0,pts:0,gf:0,ga:0})),by=t=>rows[t-NAT];
  for(const f of cl.fx)if(f.ga!=null){const A=by(f.a),B=by(f.b);A.j++;B.j++;A.gf+=f.ga;A.ga+=f.gb;B.gf+=f.gb;B.ga+=f.ga;
    if(f.ga>f.gb)A.pts+=3;else if(f.ga<f.gb)B.pts+=3;else{A.pts++;B.pts++}}
  return rows.sort(rank);
}
const clMine=()=>cl.fx.filter(f=>f.a===cl.me||f.b===cl.me);
function clNext(){ // prochain adversaire du joueur
  if(cl.stage==='league'){const f=clMine().find(f=>f.ga==null);return f?(f.a===cl.me?f.b:f.a):null}
  const p=cl.ko.find(p=>p.includes(cl.me));return p?(p[0]===cl.me?p[1]:p[0]):null;
}
function clPlayDay(mine){ // une journée : chaque club joue au plus un match, le tien d'abord ; à la 8e journée, tout ce qui reste
  const res=[],busy=new Set(),me=cl.me;
  const play=(f,r)=>{f.ga=r[0];f.gb=r[1];busy.add(f.a);busy.add(f.b);res.push({a:f.a,b:f.b,ga:f.ga,gb:f.gb})};
  const mf=clMine().find(f=>f.ga==null);
  if(mf&&mine)play(mf,mf.a===me?[mine[0],mine[1]]:[mine[1],mine[0]]);
  for(const f of shuffle(cl.fx.filter(f=>f.ga==null)))
    if(cl.md===7||(!busy.has(f.a)&&!busy.has(f.b))){const r=sim(f.a,f.b,false);play(f,[r.ga,r.gb])}
  cl.md++;const label='Journée '+cl.md;
  if(cl.md===8){
    const tab=clTable().map(r=>r.t);cl.final8=tab;
    cl.ko=[];for(let i=0;i<8;i++)cl.ko.push([tab[8+i],tab[23-i]]); // barrages : 9e–24e, 10e–23e… 16e–17e
    cl.top8=tab.slice(0,8);cl.stage='po';cl.leg=1;cl.tableNext=true;

      res.push({a,b,ga:r[0],gb:r[1]});return r});

    if(a===me||b===me){[ga,gb]=a===me?[mine[0],mine[1]]:[mine[1],mine[0]];ap=mine[2]?1:0}

function spin(el,pool,final,dur,cls){

    const t0=performance.now(),fast=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
    const show=t=>{el.innerHTML='<span class="v">'+(typeof t==='number'?`<span class="f">${t>=NAT?crest(t):T[t][1]}</span> ${T[t][0]}`:t)+'</span>';el.classList.remove('roll');void el.offsetWidth;el.classList.add('roll')};
    (function f(now){
      const p=(now-t0)/(fast?dur/4:dur);
      if(p>=1){show(final);el.classList.remove('roll');el.classList.add('hit');if(cls)el.classList.add(cls);sfx.tick(12);res();return}
      if(now-last>45+p*p*300){last=now;show(pool[(Math.random()*pool.length)|0]);sfx.tick(2)}
      requestAnimationFrame(f);
    })(t0);
  });
}

function bracketHtml(hist,stages,names,me,champ,nm){

  const won=r=>{const x=r.agg?r.agg[0]:r.ga,y=r.agg?r.agg[1]:r.gb;return x>y?r.a:r.b};
  const row=r=>{const w=won(r),sc=r.agg?`${r.ga}–${r.gb}<small>cumul ${r.agg[0]}–${r.agg[1]}${r.ap?' · but en or':''}</small>`:`${r.ga}–${r.gb}${r.ap?'<small>but en or</small>':''}`;
    const cls=r.a===me||r.b===me?'me':'';

      g.strokeStyle=gr;g.lineWidth=2.5;g.beginPath();g.moveTo(tx,ty);g.lineTo(f.x,f.y);g.stroke();
      g.fillStyle='#fff6d8';g.beginPath();g.arc(f.x,f.y,3.2,0,7);g.fill()}
    if(f.flash){const rg=g.createRadialGradient(f.x,f.y,0,f.x,f.y,110);rg.addColorStop(0,`rgba(255,245,215,${f.flash/22})`);rg.addColorStop(1,'rgba(255,245,215,0)');
      g.fillStyle=rg;g.beginPath();g.arc(f.x,f.y,110,0,7);g.fill()}
  }
  for(const p of sparks){const a=Math.max(0,p.life/p.max);g.globalAlpha=a;
    g.strokeStyle=p.c;g.lineWidth=2.2;g.beginPath();g.moveTo(p.x-p.vx*3,p.y-p.vy*3);g.lineTo(p.x,p.y);g.stroke();
    g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,2.4,0,7);g.fill()}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
function fieldT(rot){const k=scale*dpr;rot?ctx.setTransform(-k,0,0,-k,cv.width-M*k,cv.height-M*k):ctx.setTransform(k,0,0,k,M*k,M*k)}
/* ---------- Ballons : 5 designs de vrais ballons, un tiré au sort à chaque match ---------- */
function poly(cx,cy,rad,n,a0){ctx.beginPath();for(let i=0;i<n;i++){const a=a0+i*2*Math.PI/n;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}ctx.closePath()}
function pentaBall(r,base,patch,seam){ // ballon à pentagones (32 panneaux) vu de face
  ctx.fillStyle=base;ctx.fillRect(-r,-r,2*r,2*r);
  ctx.strokeStyle=seam;ctx.lineWidth=.7;
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.36,Math.sin(a)*r*.36);ctx.lineTo(Math.cos(a)*r*.7,Math.sin(a)*r*.7);ctx.stroke()}
  ctx.fillStyle=patch;poly(0,0,r*.38,5,-Math.PI/2);ctx.fill();
  for(let i=0;i<5;i++){const a=Math.PI/2+i*2*Math.PI/5;poly(Math.cos(a)*r*1.08,Math.sin(a)*r*1.08,r*.42,5,a);ctx.fill()}
}
const BALLS=[
  r=>pentaBall(r,'#f7f5ec','#161616','rgba(0,0,0,.35)'),                       // 1. Classique : blanc à pentagones noirs
  r=>{ctx.fillStyle='#8a4b22';ctx.fillRect(-r,-r,2*r,2*r);                    // 2. Vintage : cuir brun à panneaux cousus et lacet
    ctx.strokeStyle='#4a2410';ctx.lineWidth=1.1;
    for(const o of [-.55,0,.55]){ctx.beginPath();ctx.moveTo(-r,o*r);ctx.quadraticCurveTo(0,o*r+(o?o*.5*r:0),r,o*r);ctx.stroke()}
    for(const o of [-.5,.5]){ctx.beginPath();ctx.moveTo(o*r,-r);ctx.quadraticCurveTo(o*r*1.4,0,o*r,r);ctx.stroke()}
    ctx.fillStyle='#5a2c12';ctx.fillRect(-r*.08,-r*.32,r*.16,r*.64);
    ctx.strokeStyle='#e8d3a8';ctx.lineWidth=.7;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(-r*.13,k*r*.2-r*.05);ctx.lineTo(r*.13,k*r*.2+r*.05);ctx.stroke()}},
  r=>{ctx.fillStyle='#f7f5ec';ctx.fillRect(-r,-r,2*r,2*r);                    // 3. Tango : blanc à triades noires
    ctx.strokeStyle='#161616';ctx.lineCap='butt';
    for(let i=0;i<3;i++){const a=-Math.PI/2+i*2*Math.PI/3;
      ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(0,0,r*.4,a+.3,a+2*Math.PI/3-.3);ctx.stroke();              // cercle central en 3 virgules
      const c=a+Math.PI/3,cx=Math.cos(c)*r*1.02,cy=Math.sin(c)*r*1.02;                                    // cercles voisins, à moitié visibles
      for(const [rad,w] of [[r*.4,2.6],[r*.62,1.2]]){ctx.lineWidth=w;ctx.beginPath();ctx.arc(cx,cy,rad,c+Math.PI-1.1,c+Math.PI+1.1);ctx.stroke()}}},
  r=>{ctx.fillStyle='#fbfaf5';ctx.fillRect(-r,-r,2*r,2*r);                    // 4. Moderne : blanc à vagues colorées
    const C=['#1d4fa0','#d21034','#e0b54a'];
    for(let i=0;i<3;i++){const a=i*2*Math.PI/3;ctx.strokeStyle=C[i];ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(Math.cos(a)*r*.95,Math.sin(a)*r*.95,r*.72,a+Math.PI*.55,a+Math.PI*1.45);ctx.stroke()}
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(0,0,r*.34,0,7);ctx.stroke()},
  r=>pentaBall(r,'#f36c21','#1b2a6b','rgba(0,0,0,.3)')                         // 5. Hiver : orange à pentagones bleu nuit
];
let ballStyle=0;
function drawBall(){
  const b=ball,r=b.r,sp=Math.hypot(b.vx,b.vy);
  b.rot=((b.rot||0)+sp/r*.5*(b.vx+b.vy>=0?1:-1))%(2*Math.PI); // le ballon tourne quand il roule
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(b.x+2,b.y+3,r,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.clip();ctx.translate(b.x,b.y);ctx.rotate(b.rot);BALLS[ballStyle](r);ctx.restore();
  const g=ctx.createRadialGradient(b.x-r*.4,b.y-r*.45,r*.08,b.x,b.y,r); // volume : reflet en haut à gauche, ombre propre en bas
  g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.stroke();
}
function draw(t){
  drawBgCrowd();drawRoof();drawFx();
  fieldT(false);
  pitch(t);
  if((phase==='aim'&&!aim)||secondLive()){
    const pulse=.5+.5*Math.sin(t/220),mine=!(cpu&&turn==='b'),mv=phase==='moving';
    ctx.lineWidth=3;ctx.strokeStyle=mine?'#e0b54a':'#f2efe4';ctx.globalAlpha=.4+.5*pulse;
    for(const d of discs)if(mv?d.team===turn:canPlay(d)){ctx.beginPath();ctx.arc(d.x,d.y,d.r+5+pulse*3,0,7);ctx.stroke()}
    ctx.globalAlpha=1;
    const fl=(performance.now()-replayFlash)/600; // un seul flash quand tu peux rejouer
    if(phase==='aim'&&mine&&fl>=0&&fl<1){const e=Math.sin(fl*Math.PI);
      for(const d of discs)if(canPlay(d)){
        ctx.globalAlpha=.55*e;ctx.fillStyle='#fff6cf';ctx.beginPath();ctx.arc(d.x,d.y,d.r+4+e*8,0,7);ctx.fill();
        ctx.globalAlpha=e;ctx.lineWidth=4;ctx.strokeStyle='#ffffff';ctx.beginPath();ctx.arc(d.x,d.y,d.r+8+e*10,0,7);ctx.stroke()}
      ctx.globalAlpha=1}
  }
  if(aim){
    const {d}=aim,dx=d.x-aim.x,dy=d.y-aim.y,l=Math.hypot(dx,dy);
    if(l>4){
      const k=Math.min(l,MAXDRAG)/MAXDRAG,ux=dx/l,uy=dy/l;
      ctx.strokeStyle=k>.85?'#ffffff':'#e0b54a';ctx.lineWidth=k>.85?6:4;ctx.setLineDash([10,9]); // pleine puissance : trait blanc, plus épais
      ctx.beginPath();ctx.moveTo(d.x+ux*(d.r+4),d.y+uy*(d.r+4));ctx.lineTo(d.x+ux*(d.r+30+k*240),d.y+uy*(d.r+30+k*240));ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle='#e0b54a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(d.x,d.y,d.r+5,-Math.PI/2,-Math.PI/2+k*Math.PI*2);ctx.stroke();
    }
  }
  if(phase==='aim'&&!(cpu&&turn==='b')){
    const k=Math.max(0,1-turnT/TURN_MS),y=turn==='r'?H+14:-19;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,y,W,6);
    ctx.fillStyle=k<.3?'#d06a5a':'#e0b54a';ctx.fillRect(0,y,W*k,6);
  }
  if(intro)drawMenuBtn(); // à l'entrée des joueurs, ils passent par-dessus le tunnel
  for(const d of discs)if(d.loser)disc(d);
  drawBall();netsOver();
  for(const d of discs)if(!d.loser&&!d.star)disc(d);
  for(const d of discs)if(d.star)disc(d);
  if(!intro)drawMenuBtn();
  for(const c of confetti){
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.scale(1,Math.abs(Math.cos(c.rot*1.7))+.15);
    ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();
  }
  if(wx.rain&&drops.length){ // pluie : fines rayures qui tombent en biais
    ctx.strokeStyle='rgba(210,228,245,.5)';ctx.lineWidth=1.3;ctx.beginPath();
    for(const p of drops){p.y+=p.s;p.x-=p.s*.25;if(p.y>H+M){p.y=-M;p.x=Math.random()*(W+2*M)-M+100}ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+4,p.y-16)}
    ctx.stroke();
  }
}

let lastSecClock=-1,frameN=0,acc=0,prev=performance.now(),lastMin=-1,lastSec=-1;
function loop(t){
  acc+=Math.min(100,t-prev);prev=t;
  while(acc>=1000/60){
    if(phase==='moving'){
      step();
      if(ball.y<-ball.r&&Math.abs(ball.x-W/2)<GOAL/2){checkGoal('r')}
      else if(ball.y>H+ball.r&&Math.abs(ball.x-W/2)<GOAL/2){checkGoal('b')}
      else if(!moving())settle();
    }
    if(phase==='goal'&&goalRoll&&!(goalCel&&goalCel.t>=GC_BACK))stepBall(); // le ballon finit sa course dans le filet
    if(goalCel)goalCelStep();
    if(intro)introStep();
    if(match&&match.half&&!match.golden&&(phase==='aim'||phase==='moving')){
      match.left-=1000/60;const sc=Math.ceil(match.left/1000);
      if(sc!==lastSecClock){lastSecClock=sc;ui();if(sc<=5&&sc>0)sfx.tick(12)}
      if(match.left<=0&&phase==='aim')endHalf(); // le temps s'arrête quand le ballon est immobile
    }
    if(phase==='aim'&&!(cpu&&turn==='b')){
      turnT+=1000/60;const sec=Math.ceil((TURN_MS-turnT)/1000);
      if(sec!==lastSec){lastSec=sec;ui();if(sec<=3&&sec>0)sfx.tick(6)}
      if(turnT>=TURN_MS)timeUp();
    }
    if(celeb)animStep();
    if(crowdG&&((frameN=(frameN||0)+1)%5===0)){
      const th=threat(),near=Math.min(ball.y,H-ball.y),late=match&&match.half===2&&match.left<15000?.03:0;
      let lv=.08+late;
      if(phase==='menu')lv=.03;
      else if(phase==='goal'||celeb)lv=.2;
      else if(phase==='intro')lv=.16;
      else lv+=(phase==='moving'?.05:.02)*Math.max(0,1-near/320)+th*.22+enc*.2; // la tribune gronde quand le ballon approche d'un but, et explose sur un tir cadré
      crowdLevel(lv);
      enc=encourage();crowdOh(phase==='moving'?th:phase==='aim'?Math.max(Math.max(0,1-near/300)*.3,enc*.75):0);
      if(phase==='moving'){peakTh=Math.max(peakTh,th);
        if(peakTh>.5&&th<.12){if(ac.currentTime>yeahUntil)crowdOhh(peakTh);peakTh=0}} // l'occasion est passée : « ohhhh ! »
      else if(phase!=='goal')peakTh=0;
      if(saveAt&&performance.now()-saveAt>600){saveAt=0;if(phase==='aim'||phase==='moving'){stopChant();sfx.applause(true);nextChant=Math.max(nextChant,ac.currentTime+rr(5,9))}} // arrêt du gardien : le public applaudit
      chantTick();
    }
    acc-=1000/60;
  }
  draw(t);requestAnimationFrame(loop);
}
addEventListener('resize',resize);
/* ---------- Match en cours : pause quand on quitte l'appli, reprise au retour (même après fermeture) ---------- */
const LIVE_KEY='touchfc-live-v1';
function saveLive(){
  try{
    const ph=phase==='aim'||phase==='moving'?phase:paused;
    if(!match){localStorage.removeItem(LIVE_KEY);return}
    if(!ph)return; // but, mi-temps, coup d'envoi en cours : on garde la dernière sauvegarde au lieu d'effacer le match
    localStorage.setItem(LIVE_KEY,JSON.stringify({ph,discs,ball,score,turn,flicks,maxFlicks,kickoff,lastTouch,lastScorer,
      sixTurn,sixFresh,sixShot,kickShot,kickTouched,kickFoul,kickFresh,shotZone,shooter,lineRun,lineEnd,stuckRun,possPos,oppTouch,
      lastShot:discs.indexOf(lastShot),match,mode,cpu,S,flip,wx,stake,roofStyle,ballStyle,t:Date.now()}));
  }catch(_){}
}
function clearLive(){try{localStorage.removeItem(LIVE_KEY)}catch(_){}}
function loadLive(){
  let L=null;try{L=JSON.parse(localStorage.getItem(LIVE_KEY))}catch(_){}
  if(!L||!L.discs||!L.match)return false;
  if((L.mode==='cup'&&!cup)||(L.mode==='cl'&&!cl)){clearLive();return false} // compétition abandonnée entre-temps
  ({discs,ball,score,turn,flicks,maxFlicks,kickoff,lastTouch,lastScorer,sixTurn,sixFresh,sixShot,kickShot,kickTouched,kickFoul,kickFresh,
    shotZone,shooter,lineRun,lineEnd,stuckRun=0,possPos=null,oppTouch=false,match,mode,cpu,flip,wx,stake,roofStyle,ballStyle}=L);
  S.r=L.S.r;S.b=L.S.b;lastShot=discs[L.lastShot]||null;
  drops=wx.rain?Array.from({length:90},()=>({x:Math.random()*(W+2*M)-M,y:Math.random()*(H+2*M)-M,s:9+Math.random()*6})):[];
  paused=L.ph;phase='menu';aim=null;intro=null;goalCel=null;celeb=null;shownTurn=turn;turnT=0;lastSecClock=-1;roofKey='';bgKey='';
  return true;
}
function leaveApp(){ // on quitte l'appli (ou l'onglet) : le match passe en pause
  if(phase==='aim'||phase==='moving'){paused=phase;phase='menu';aim=null;showHome();ui()}
  saveLive();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)leaveApp()});
addEventListener('pagehide',leaveApp);
setInterval(()=>{if(phase==='aim'||phase==='moving')saveLive()},3000); // filet de sécurité si l'appli est fermée brutalement

(()=>{ // appli sur l'écran d'accueil : si l'iPhone ne donne pas la hauteur de sa barre d'état, on l'estime d'après le modèle
  try{const pr=document.createElement('div');pr.style.cssText='position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden';document.body.appendChild(pr);
    const sat=parseFloat(getComputedStyle(pr).paddingTop)||0;pr.remove();
    if(navigator.standalone&&sat<20&&innerHeight>screen.height-20){ // seulement si la page passe vraiment sous la barre d'état : sinon le score était décalé deux fois
      const h=Math.max(screen.height,screen.width);document.documentElement.style.setProperty('--sat',([852,874,932,956].includes(h)?59:h>=812?47:20)+'px')}}catch(_){}
})();
reset();resize();
if(loadLive()){showHome();if(wx.rain)try{rainSound(true)}catch(_){}}else showHome();
ui();requestAnimationFrame(loop);
})();
