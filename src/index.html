<style>
/* Layout : une seule vue plein écran — tableau de score, pelouse, barre d'état ; menus et coupe dans un panneau par-dessus. Univers "feutrine de salon", un seul thème sombre. */
:root{
  --ink:#0f2016; --panel:#132a1c; --line:#35523f; --chalk:#f2efe4;
  --brass:#e0b54a; --muted:#9fb7a5; --ok:#5fbf7a; --warn:#d9a441; --bad:#d06a5a;
  --display:"Saira Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#roof,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.board{position:relative;z-index:2}
.overlay,.banner,.turn{z-index:3}
.app{position:relative;z-index:1}
.board{background:rgba(10,22,14,.84);border-radius:12px;padding:4px 6px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.team{display:flex;align-items:center;gap:7px;min-width:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.team .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team,.team.b{flex-direction:column;justify-content:center;text-align:center;gap:3px}
.team .fl{font-size:30px;line-height:1}
.team .nm{white-space:normal;text-wrap:balance;line-height:1.05;max-width:100%;overflow-wrap:anywhere}
.team.on{color:var(--chalk)}
.team{padding:5px 6px;border-radius:10px;transition:background .25s,color .25s}
.team.on{background:rgba(224,181,74,.16);box-shadow:inset 0 0 0 1px rgba(224,181,74,.55)}
.turn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;
  background:var(--ink);border:2px solid var(--brass);border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 14px rgba(0,0,0,.5);animation:turnIn 1.3s ease forwards}
@keyframes turnIn{0%{opacity:0;transform:translate(-50%,-12px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}22%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
.chip{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.4)}
.team.on .chip{outline:2px solid var(--brass);outline-offset:2px}
.mid{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.score{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;
  background:#08130c;border:1px solid #2b4434;border-radius:6px;padding:2px 12px 4px;color:var(--brass)}
.half{font-family:var(--display);font-weight:600;font-size:13px;line-height:1;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;min-height:13px}
.clock{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.clock .t{font-weight:800;font-size:24px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;background:#08130c;border:1px solid #2b4434;border-radius:6px;padding:2px 9px 3px;color:var(--brass);transition:color .25s,border-color .25s}
.clock .t.low{color:var(--bad);border-color:var(--bad)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.msg{font-size:13px;color:var(--muted);min-width:0}
.msg b{color:var(--chalk);font-weight:600}
button{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:6px;color:var(--chalk)}
.ghost{background:none;border:1px solid var(--line);font-size:14px;padding:6px 12px;white-space:nowrap}
.msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,22,14,.74);padding:8px;box-sizing:border-box}
.card{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:20px 16px;width:min(380px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px;text-align:center;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card h1{font-family:var(--display);font-weight:800;font-size:42px;line-height:.92;margin:0;letter-spacing:.02em;text-wrap:balance}
.card h1 span{color:var(--brass)}
.card h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;text-align:left}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.big{background:var(--brass);color:#1b1405;border:0;font-size:20px;padding:12px}
.alt{background:none;border:1px solid var(--brass);color:var(--brass);font-size:18px;padding:10px}
.small{background:none;border:1px solid var(--line);font-size:14px;padding:8px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 10px}
.fixture .tm{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em}
.fixture .fl{font-size:34px;line-height:1}
.fixture .vs{font-family:var(--display);color:var(--muted);font-size:16px}
.picker{display:flex;flex-direction:column;gap:6px;text-align:left}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:9px 8px;font-family:var(--body);font-weight:600;letter-spacing:0;text-transform:none;font-size:13px;text-align:left;min-width:0}
.pick span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .f{font-size:20px;flex:none}
.slots{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center}
.pot{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left}
.slot{background:#08130c;border:1px solid #2b4434;border-radius:6px;padding:9px 10px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.03em;

.slot .f{font-size:20px}
.slot .v,#slG .v{display:inline-block}
.slot.roll .v,#slG.roll .v{animation:roll .09s linear}
.slot.hit{border-color:var(--brass)}
.slot.me{background:var(--brass);color:#1b1405}
#slG{display:inline-block;min-width:.8em;transition:color .25s}
@keyframes roll{from{transform:translateY(-35%);opacity:.4}to{transform:none;opacity:1}}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid #22392b;text-align:center}

.tbl tr.me td{color:var(--brass);font-weight:600}

.res div.me{color:var(--brass);font-weight:600}

.res .r{text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note{font-size:12px;color:var(--muted)}
.trophy{font-size:56px;line-height:1}
.round{font-family:var(--display);font-weight:800;font-size:15px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.clock.big{position:relative;z-index:2;align-self:center;font-size:16px;background:rgba(10,22,14,.84);border-radius:12px;padding:4px 10px}
.clock.big .t{font-size:40px;padding:3px 16px 5px}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-weight:800;font-size:60px;line-height:1;color:var(--brass);

.banner small{display:block;font-size:22px;color:var(--chalk);letter-spacing:.06em;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

function drawR32(pots){
  // un du chapeau 1 contre un du chapeau 2 ; on évite deux équipes de la même confédération (sauf l'UEFA, trop nombreuse)
  for(let tries=0;tries<5000;tries++){
    const b=shuffle(pots[1]);

}

    let opp=1e9,own=1e9;
    for(const o of discs){const dd=Math.hypot(o.x-x,o.y-y);if(o.team==='r')opp=Math.min(opp,dd);else if(o!==shooterDisc)own=Math.min(own,dd)}
    if(opp>R+BR+110||own<opp-20)return 0;                  // personne de l'adversaire pour le récupérer, ou un des nôtres plus près
    const close=1-Math.min(1,Math.max(0,opp-(R+BR))/110);   // 1 = ballon collé à un adversaire
    const danger=y<ZONE?3:y<H/2?1.6:.6;                     // dans la zone de tir adverse : cadeau mortel
    return Math.round(close*danger*260);
  }
  function plan(T,kind){ // meilleur joueur pour envoyer le ballon vers T
    let best=null;const ul=Math.hypot(T.x-ball.x,T.y-ball.y)||1,ux=(T.x-ball.x)/ul,uy=(T.y-ball.y)/ul;
    const px=ball.x-ux*(R+BR-3),py=ball.y-uy*(R+BR-3);
    for(const d of mine){
      const dx=px-d.x,dy=py-d.y,dist=Math.hypot(dx,dy)||1;
      const tEnd=Math.max(0,1-(R+BR+2)/dist),t=Math.max(0,Math.min(tEnd,((ball.x-d.x)*dx+(ball.y-d.y)*dy)/(dist*dist)));
      if(Math.hypot(d.x+dx*t-ball.x,d.y+dy*t-ball.y)<R+BR-1)continue;          // toucherait le ballon du mauvais côté
      const cos=(dx*ux+dy*uy)/dist;if(cos<.35)continue;                            // angle de frappe trop fermé
      let cost=dist*.6+(1-cos)*400+segHits(d.x,d.y,px,py,R*2,[d,ball])*350;       // chemin du joueur
      cost+=segHits(ball.x,ball.y,T.x,T.y,R+BR+2,[d,ball])*(kind==='shot'?450:250); // chemin du ballon
      // puissance : à fond pour tirer ou dégager, dosée pour avancer
      let v=MAXV;
      if(kind==='pass'){let lo=4,hi=MAXV;for(let i=0;i<14;i++){const m=(lo+hi)/2;ballTravel(1.39*cos*discAt(m,dist))<ul?lo=m:hi=m}v=Math.min(MAXV,hi*1.05)}
      if(kind==='shot'&&ballTravel(1.39*cos*discAt(MAXV,dist))<ul-20)cost+=900;   // tir trop court
      if(kind!=='shot')cost+=gift(ux,uy,ballTravel(1.39*cos*discAt(v,dist)),d);     // ne pas offrir le ballon à l'adversaire
      if(!best||cost<best.cost)best={d,dx,dy,dist,cost,v,kind};
    }
    return best;
  }
  const opts=[];
  const oppGk=discs.find(o=>o.team==='r'&&o.gk),gkSide=oppGk&&oppGk.x<W/2?1:-1;
  // 1. marquer : plusieurs cibles dans le but, de préférence loin du gardien
  if(H-ball.y<460)for(const o of [-64,-34,0,34,64]){const p=plan({x:W/2+o,y:H+12},'shot');if(p){p.cost+=(o*gkSide<0?160:0)-300;opts.push(p)}}
  const threat=ball.y<430; // le ballon est à portée de tir de l'adversaire
  // 2. défendre en dégageant le ballon loin de sa cage, sur un côté
  if(threat)for(const cx of [W*.12,W*.88,W*.5]){const p=plan({x:cx,y:Math.min(H-60,ball.y+420)},'clear');if(p){p.cost+=cx===W*.5?120:0;opts.push(p)}}
  // 3. avancer vers le couloir le moins défendu
  for(const cx of [W*.2,W*.5,W*.8])for(const dy of [180,300,420]){const p=plan({x:cx,y:Math.min(H-150,ball.y+dy)},'pass');if(p){p.cost+=200+(dy===300?0:40);opts.push(p)}}
  opts.sort((a,b)=>a.cost-b.cost);
  let pick=opts[0];
  // 4. si la menace est réelle et qu'aucune action sûre n'existe : couper la route du but (gardien d'abord, puis un défenseur)
  if(threat&&(!pick||pick.cost>950)){
    const gx=W/2,gy=8,bl=Math.hypot(gx-ball.x,gy-ball.y)||1;
    const myGk=discs.find(d=>d.team==='b'&&d.gk);
    const gT={x:Math.max(BOX.x0+R,Math.min(BOX.x1-R,gx+(ball.x-gx)*40/Math.max(40,ball.y))),y:40};
    const moves=[];
    if(myGk&&Math.hypot(myGk.x-gT.x,myGk.y-gT.y)>28)moves.push({d:myGk,x:gT.x,y:gT.y});
    const k=Math.min(140,bl*.5);moves.push(...discs.filter(d=>d.team==='b'&&!d.gk).map(d=>({d,x:ball.x+(gx-ball.x)/bl*k,y:Math.max(R+2,ball.y+(gy-ball.y)/bl*k)})));
    let mv=null;
    for(const m of moves){const dx=m.x-m.d.x,dy=m.y-m.d.y,dl=Math.hypot(dx,dy)||1,t=Math.max(0,Math.min(1,((ball.x-m.d.x)*dx+(ball.y-m.d.y)*dy)/(dl*dl)));
      if(dl<20||Math.hypot(m.d.x+dx*t-ball.x,m.d.y+dy*t-ball.y)<R+BR+4)continue;
      const c=m.d.gk?0:dl;if(!mv||c<mv.c)mv={...m,dx,dy,dl,c}}
    if(mv){const v=Math.min(MAXV*.8,Math.sqrt(mv.dl/.97));shoot(mv.d,mv.dx/mv.dl*v,mv.dy/mv.dl*v);return}
  }
  if(!pick){ // rien de jouable : se replacer à côté du ballon sans le toucher
    const d=discs.filter(d=>d.team==='b'&&!d.gk).sort((x,y)=>Math.hypot(x.x-ball.x,x.y-ball.y)-Math.hypot(y.x-ball.x,y.y-ball.y))[0];
    const sx=d.x<ball.x?-1:1,lx=Math.max(R,Math.min(W-R,ball.x+sx*(R+BR+22))),ly=Math.max(R,ball.y-(R+BR));
    const dx=lx-d.x,dy=ly-d.y,dl=Math.hypot(dx,dy)||1,v=Math.min(MAXV*.6,Math.sqrt(dl/.97));
    shoot(d,dx/dl*v,dy/dl*v);return;
  }
  // précision selon le niveau de l'équipe (et plus prudente devant sa propre cage)
  const lvl=S.b.skill||.14,noise=lvl*.42*(ball.y<260?.5:1);
  const a=Math.atan2(pick.dy,pick.dx)+(Math.random()-.5)*2*noise,v=pick.v*(1+(Math.random()-.5)*lvl*.5);
  shoot(pick.d,Math.cos(a)*Math.min(MAXV,v),Math.sin(a)*Math.min(MAXV,v));
}

/* ---------- Fête de fin de match ---------- */
function celebrate(team,cb){
  phase='over';
  const mine=discs.filter(d=>d.team===team);
  const sc=mine[lastScorer[team]]||mine[3];
  const cy=team==='r'?72:H-72;
  const cx=sc.x<W/2?72:W-72;
  const base=Math.atan2(H/2-cy,W/2-cx);
  sc.path=[{x:cx,y:cy}];sc.delay=0;sc.spd=5.5;sc.star=true;
  mine.filter(d=>d!==sc).forEach((d,i)=>{
    const a=base+[-1.15,-.38,.38,1.15][i];
    d.path=[{x:cx+Math.cos(a)*66,y:cy+Math.sin(a)*66}];d.delay=22+i*9;d.spd=4.2;d.ph=i*9;
  });
  discs.filter(d=>d.team!==team).sort((a,b)=>Math.hypot(a.x,a.y-H/2)-Math.hypot(b.x,b.y-H/2)).forEach((d,i)=>{
    d.path=flip?[{x:W-34,y:H/2+(d.y<H/2?-12:12)},{x:W+M+40,y:H/2}]:[{x:34,y:H/2+(d.y<H/2?-12:12)},{x:-M-40,y:H/2}];d.delay=30+i*26;d.spd=2;d.loser=true;
  });
  celeb={team,t:0};confetti=[];fireworks=[];sparks=[];ui();
  banner('VICTOIRE !',mode==='cup'?`${S[team].flag} ${S[team].name}`:'');
  setTimeout(()=>{$('banner').hidden=true;if(phase==='over')cb()},5200);
}
function animStep(){
  celeb.t++;
  for(const d of discs){
    if(!d.path)continue; if(d.delay>0){d.delay--;continue}
    const p=d.path[0];if(!p)continue;
    const dx=p.x-d.x,dy=p.y-d.y,l=Math.hypot(dx,dy);
    if(l<=d.spd){d.x=p.x;d.y=p.y;d.path.shift()}else{d.x+=dx/l*d.spd;d.y+=dy/l*d.spd}
  }
  // feux d'artifice : des fusées partent du rebord du toit et éclatent au-dessus de la pelouse, aux couleurs du vainqueur
  if(celeb.t>20&&celeb.t<400&&Math.random()<.09){
    const s=S[celeb.team],a=Math.random()*Math.PI*2,c=Math.cos(a),sn=Math.sin(a),R0=ROOF;
    const x0=W/2+R0.A*Math.sign(c)*Math.pow(Math.abs(c),2/R0.N),y0=H/2+R0.B*Math.sign(sn)*Math.pow(Math.abs(sn),2/R0.N);
    const pal=[['#e0b54a','#fff3c4'],[s.main,s.main],[s.sec,s.sec],['#f2efe4','#ffffff']][(Math.random()*4)|0];
    fireworks.push({x0,y0,x:x0,y:y0,tx:60+Math.random()*(W-120),ty:90+Math.random()*(H-180),t:0,dur:38+Math.random()*22,pal,two:Math.random()<.35?s.sec:null});
  }
  for(const f of fireworks){
    f.t++;const k=Math.min(1,f.t/f.dur),e=1-Math.pow(1-k,2.2);f.x=f.x0+(f.tx-f.x0)*e;f.y=f.y0+(f.ty-f.y0)*e;
    if(k>=1&&!f.done){f.done=true;f.flash=10;sfx.boom();
      const n=46+((Math.random()*24)|0);
      for(let i=0;i<n;i++){const an=i/n*Math.PI*2+Math.random()*.15,v=3+Math.random()*3.8;
        sparks.push({x:f.x,y:f.y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:60+Math.random()*30,max:90,c:f.two&&i%2?f.two:f.pal[i%2]})}}
    if(f.flash)f.flash--;
  }
  fireworks=fireworks.filter(f=>!f.done||f.flash>0);
  for(const p of sparks){p.x+=p.vx;p.y+=p.vy;p.vx*=.955;p.vy*=.955;p.life--}
  sparks=sparks.filter(p=>p.life>0);
}

/* ---------- Coupe du monde ---------- */
const KEY='touchfc-cup-v2';
function saveCup(){try{cup?localStorage.setItem(KEY,JSON.stringify(cup)):localStorage.removeItem(KEY)}catch(_){}}
function loadCup(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(_){return null}}
cup=loadCup();if(cup&&(!cup.ko&&cup.stage!=='done'||cup.host===undefined))cup=null;

function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function sim(a,b,ko){
  const d=elo(a)-elo(b);
  const r={a,b,ga:poisson(1.25*Math.exp(d/700)),gb:poisson(1.25*Math.exp(-d/700))};
  if(ko&&r.ga===r.gb){const pa=1/(1+Math.pow(10,-d/400));if(Math.random()<pa)r.ga++;else r.gb++;r.ap=1}
  return r;
}
function rank(x,y){return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||elo(y.t)-elo(x.t)}
function newCup(me){
  const host=pickHost(),pots=makePots(host,me);
  cup={me,host,pots,stage:'r32',ko:drawR32(pots),last:[],lastLabel:'',out:null,champ:null};
  saveCup();showReveal();
}
function nextOpp(){
  const p=cup.ko.find(p=>p.includes(cup.me));return p?(p[0]===cup.me?p[1]:p[0]):null;
}
function playRound(mine){
  const me=cup.me,res=[];
  const st=cup.stage,winners=[];
  for(const [a,b] of cup.ko){
    let r;
    if(mine&&(a===me||b===me)){r=a===me?{a,b,ga:mine[0],gb:mine[1]}:{a,b,ga:mine[1],gb:mine[0]};if(mine[2])r.ap=1}
    else r=sim(a,b,true);
    res.push(r);winners.push(r.ga>r.gb?a:b);
    const w=r.ga>r.gb?a:b;cup.boost=cup.boost||{};cup.boost[w]=(cup.boost[w]||0)+BOOST;
  }
  if(!cup.out&&cup.ko.some(p=>p.includes(me))&&!winners.includes(me))cup.out=st;
  if(st==='final'){cup.champ=winners[0];cup.stage='done'}
  else{cup.ko=[];for(let i=0;i<winners.length;i+=2)cup.ko.push([winners[i],winners[i+1]]);cup.stage=STAGES[STAGES.indexOf(st)+1]}
  return {res,label:STAGE_NAME[st]};
}
function afterCupMatch(){
  const {res,label}=playRound([score.r,score.b,match.golden?1:0]);
  cup.last=res;cup.lastLabel=label;
  while(cup.out&&cup.stage!=='done')playRound(null); // on va au bout pour connaître le champion
  saveCup();mode='cup-hub';showHub();
}
function startCupMatch(){
  const me=cup.me,op=nextOpp(),A=T[me],B=T[op];
  setTeams(me,op);
  mode='cup';cpu=true;match={elapsed:0,golden:false,ko:true};
  begin();
}
/* Écusson générique des clubs : pas de logo officiel (protégé), mais un même blason pour tous,
   aux couleurs du club, avec son abréviation */
function crest(t){
  const r=T[t],m=r[2],s=r[3],[R,G,B]=rgb(m),ink=(R*.3+G*.59+B*.11)>150?'#111':'#fff';
  return `<svg viewBox="0 0 40 46" width="1.05em" height="1.2em" style="vertical-align:-.22em" aria-label="${r[0]}"><path d="M4 3h32v19c0 12-8 18-16 22C12 40 4 34 4 22z" fill="${m}" stroke="${s}" stroke-width="2.5"/><path d="M5.2 4.2h29.6v8H5.2z" fill="${s}"/><text x="20" y="33" text-anchor="middle" font-family="Saira Extra Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="${r[9].length>2?13:15}" fill="${ink}">${r[9]}</text></svg>`;
}
const ctn=t=>`${crest(t)} ${T[t][0]}`;
/* ---------- CHAMP LEAGUE : sur le modèle de la Ligue des champions (formule depuis 2024-25) ----------
   36 clubs, phase de ligue en un seul classement : 8 matchs contre 8 adversaires différents (2 par chapeau).
   1er à 8e : directement en huitièmes ; 9e à 24e : barrages ; 25e à 36e : éliminés.
   Barrages, huitièmes, quarts et demies en aller-retour (cumul des buts, but en or au retour si égalité) ; finale sur un match. */
const CL_KEY='touchfc-cl-v1';
const CL_STAGES=['po','r16','qf','sf','final'];
const CL_NAME={league:'Phase de ligue',po:'Barrages',r16:'Huitièmes de finale',qf:'Quarts de finale',sf:'Demi-finales',final:'Finale'};
const CL_ELIM={league:'en phase de ligue',po:'en barrages',r16:'en huitièmes de finale',qf:'en quarts de finale',sf:'en demi-finale',final:'en finale'};
const CLUB_IDS=[...Array(T.length-NAT).keys()].map(i=>NAT+i);
const ctry=t=>T[t][8];
let cl=null,clView='mine';
function saveCl(){try{cl?localStorage.setItem(CL_KEY,JSON.stringify(cl)):localStorage.removeItem(CL_KEY)}catch(_){}}
try{const s=localStorage.getItem(CL_KEY);cl=s?JSON.parse(s):null;if(cl&&!cl.pots)cl=null}catch(_){cl=null}
function clDraw(me){ // tirage : 4 chapeaux de 9 au classement ; 2 adversaires par chapeau, jamais un club du même pays
  const ord=CLUB_IDS.slice().sort((x,y)=>T[y][4]-T[x][4]),pots=[0,1,2,3].map(p=>shuffle(ord.slice(p*9,p*9+9)));
  const fx=[];
  for(let i=0;i<4;i++)for(let j=i;j<4;j++){
    let best=null;
    for(let tries=0;tries<400;tries++){
      const A=pots[i],B=i===j?A:shuffle(pots[j]),pairs=[];
      if(i===j){const c=shuffle(A);for(let k=0;k<9;k++)pairs.push([c[k],c[(k+1)%9]])}       // même chapeau : un cycle, 2 adversaires chacun
      else for(let k=0;k<9;k++){pairs.push([A[k],B[k]]);pairs.push([A[k],B[(k+1)%9]])}       // deux chapeaux : chacun en affronte 2 de l'autre
      const bad=pairs.filter(([a,b])=>ctry(a)===ctry(b)).length;
      if(!best||bad<best.bad)best={pairs,bad};if(!bad)break;
    }
    fx.push(...best.pairs.map(([a,b])=>({a,b})));
  }
  for(const f of fx)if(Math.random()<.5)[f.a,f.b]=[f.b,f.a]; // qui reçoit
  cl={me,pots,fx,stage:'league',md:0,ko:null,leg:1,first:null,last:[],lastLabel:'',out:null,champ:null};
  clView='mine';saveCl();
}
function clTable(){
  const rows=CLUB_IDS.map(t=>({t,j:0,pts:0,gf:0,ga:0})),by=t=>rows[t-NAT];
  for(const f of cl.fx)if(f.ga!=null){const A=by(f.a),B=by(f.b);A.j++;B.j++;A.gf+=f.ga;A.ga+=f.gb;B.gf+=f.gb;B.ga+=f.ga;
    if(f.ga>f.gb)A.pts+=3;else if(f.ga<f.gb)B.pts+=3;else{A.pts++;B.pts++}}
  return rows.sort(rank);
}
const clMine=()=>cl.fx.filter(f=>f.a===cl.me||f.b===cl.me);
function clNext(){ // prochain adversaire du joueur
  if(cl.stage==='league'){const f=clMine().find(f=>f.ga==null);return f?(f.a===cl.me?f.b:f.a):null}
  const p=cl.ko.find(p=>p.includes(cl.me));return p?(p[0]===cl.me?p[1]:p[0]):null;
}
function clPlayDay(mine){ // une journée : chaque club joue au plus un match, le tien d'abord ; à la 8e journée, tout ce qui reste
  const res=[],busy=new Set(),me=cl.me;
  const play=(f,r)=>{f.ga=r[0];f.gb=r[1];busy.add(f.a);busy.add(f.b);res.push({a:f.a,b:f.b,ga:f.ga,gb:f.gb})};
  const mf=clMine().find(f=>f.ga==null);
  if(mf&&mine)play(mf,mf.a===me?[mine[0],mine[1]]:[mine[1],mine[0]]);
  for(const f of shuffle(cl.fx.filter(f=>f.ga==null)))
    if(cl.md===7||(!busy.has(f.a)&&!busy.has(f.b))){const r=sim(f.a,f.b,false);play(f,[r.ga,r.gb])}
  cl.md++;const label='Journée '+cl.md;
  if(cl.md===8){
    const tab=clTable().map(r=>r.t);cl.final8=tab;
    cl.ko=[];for(let i=0;i<8;i++)cl.ko.push([tab[8+i],tab[23-i]]); // barrages : 9e–24e, 10e–23e… 16e–17e
    cl.top8=tab.slice(0,8);cl.stage='po';cl.leg=1;cl.tableNext=true;
    if(!tab.slice(0,24).includes(me))cl.out='league';
  }
  return {res,label};
}
function clPlayLeg(mine){ // une manche à élimination : aller, puis retour (ou la finale)
  const me=cl.me,st=cl.stage,res=[];if(mine)cl.tableNext=false;
  if(st!=='final'&&cl.leg===1){
    cl.first=cl.ko.map(([a,b])=>{const r=a===me||b===me?(a===me?[mine[0],mine[1]]:[mine[1],mine[0]]):(()=>{const s=sim(a,b,false);return [s.ga,s.gb]})();
      res.push({a,b,ga:r[0],gb:r[1]});return r});
    cl.leg=2;return {res,label:CL_NAME[st]+' · aller'};
  }
  const winners=[];
  cl.ko.forEach(([a,b],k)=>{
    const f=cl.first?cl.first[k]:[0,0];let ga,gb,ap=0;
    if(a===me||b===me){[ga,gb]=a===me?[mine[0],mine[1]]:[mine[1],mine[0]];ap=mine[2]?1:0}
    else{const s=sim(a,b,false);ga=s.ga;gb=s.gb;
      if(f[0]+ga===f[1]+gb){ap=1;const pa=1/(1+Math.pow(10,-(elo(a)-elo(b))/400));Math.random()<pa?ga++:gb++}}
    res.push({a,b,ga,gb,ap,agg:st!=='final'?[f[0]+ga,f[1]+gb]:null});
    winners.push(f[0]+ga>f[1]+gb?a:b);
  });
  if(!cl.out&&cl.ko.some(p=>p.includes(me))&&!winners.includes(me))cl.out=st;
  const label=CL_NAME[st]+(st!=='final'?' · retour':'');
  cl.first=null;cl.leg=1;
  if(st==='final'){cl.champ=winners[0];cl.stage='done'}
  else if(st==='po'){ // huitièmes : le 1er contre le vainqueur du barrage 16e–17e… le 8e contre celui du 9e–24e
    cl.ko=cl.top8.map((t,i)=>[t,winners[7-i]]);
    const o=[0,7,3,4,1,6,2,5];cl.ko=o.map(i=>cl.ko[i]);cl.stage='r16';
  }else{cl.ko=[];for(let i=0;i<winners.length;i+=2)cl.ko.push([winners[i],winners[i+1]]);cl.stage=CL_STAGES[CL_STAGES.indexOf(st)+1]}
  return {res,label};
}
function clSimLeague(me){ // phase de ligue simulée d'office (selon l'Elo) ; on retire le tirage tant que ton club ne finit pas dans le top 24
  for(let k=0;k<300;k++){
    clDraw(me);while(cl.stage==='league')clPlayDay(null);
    if(!cl.out)break;
  }
  cl.out=null;cl.simLeague=true;
  const mine=clMine();cl.last=mine.map(f=>({a:f.a,b:f.b,ga:f.ga,gb:f.gb}));cl.lastLabel='Phase de ligue (simulée)';
  clAdvance();saveCl();mode='cl-hub';showClHub();
}
function clRound(mine){return cl.stage==='league'?clPlayDay(mine):clPlayLeg(mine)}
function clAdvance(){ // éliminé : on va au bout ; qualifié directement pour les huitièmes : les barrages se jouent sans toi
  while(cl.stage!=='done'&&(cl.out||(cl.stage!=='league'&&!cl.ko.some(p=>p.includes(cl.me))))){if(cl.stage==='po'&&!cl.out)cl.skipPo=true;clRound(null)}
}
function afterClMatch(){
  const {res,label}=clRound([score.r,score.b,match.golden?1:0]);
  cl.last=res;cl.lastLabel=label;
  clAdvance();saveCl();mode='cl-hub';showClHub();
}

  'France':[[69,2],[72,1],[69,.5],[66,.5],[69,1],[67,2]], // La Marseillaise (1792) : « a-breu-ve nos sil-lons », la phrase entière

const IN_ANTHEM=210,IN_END=300; // images à 60 par seconde : 300 = 5 s
function startIntro(){
  phase='intro';aim=null;
  const home=discs.map(d=>({x:d.x,y:d.y})),idx={r:0,b:0};
  intro={t:0,ps:discs.map((d,k)=>{const i=idx[d.team]++,e=d.gk?4:i-1,s=d.team==='r'?1:-1,bl=d.team==='b'?1:0;
    // sortie en file indienne, un joueur à la fois en alternant les équipes, les gardiens en dernier ;
    // hymnes : une seule ligne parallèle à la tribune côté vestiaire, chaque équipe sur sa moitié, gardien au bout côté de son but
    return {from:{x:-70,y:H/2},anth:{x:130,y:H/2+s*(40+e*52)},home:home[k],start:(2*e+bl)*10}})};
  discs.forEach((d,k)=>{d.x=intro.ps[k].from.x;d.y=intro.ps[k].from.y;d.vx=d.vy=0});
  ball.x=-9999;ball.y=H/2;
  sfx.applause();ui();
}
function introStep(){
  const t=++intro.t,ease=p=>p<.5?2*p*p:1-2*(1-p)*(1-p),cl=p=>Math.max(0,Math.min(1,p));
  discs.forEach((d,k)=>{const P=intro.ps[k];let a,b,p;
    d.hid=t<P.start; // encore dans le vestiaire
    if(t<IN_ANTHEM){const u=t-P.start,gate={x:R+6,y:P.from.y}; // tout droit hors du tunnel jusqu'à la ligne de touche franchie, puis vers sa place
      if(u<18){a=P.from;b=gate;p=cl(u/18)}else{a=gate;b=P.anth;p=cl((u-18)/50);p=1-(1-p)*(1-p)}}else{a=P.anth;b=P.home;p=ease(cl((t-IN_ANTHEM)/80))}
    d.x=a.x+(b.x-a.x)*p;d.y=a.y+(b.y-a.y)*p});
  if(t===160)sfx.anthem(S.r.name); // tout le monde est aligné : hymne de l'équipe qui reçoit
  if(t===IN_ANTHEM){ball.x=W/2;ball.y=H/2}
  if(t>=IN_END){intro=null;discs.forEach(d=>d.hid=false);reset();setAim();sfx.whistle('kick')}
}

/* Révélation du tirage, façon machine à sous */
function spin(el,pool,final,dur,cls){
  return new Promise(res=>{
    const t0=performance.now(),fast=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
    const show=t=>{el.innerHTML='<span class="v">'+(typeof t==='number'?`<span class="f">${t>=NAT?crest(t):T[t][1]}</span> ${T[t][0]}`:t)+'</span>';el.classList.remove('roll');void el.offsetWidth;el.classList.add('roll')};
    (function f(now){
      const p=(now-t0)/(fast?dur/4:dur);
      if(p>=1){show(final);el.classList.remove('roll');el.classList.add('hit');if(cls)el.classList.add(cls);sfx.tick(12);res();return}
      if(now-last>45+p*p*300){last=now;show(pool[(Math.random()*pool.length)|0]);sfx.tick(2)}
      requestAnimationFrame(f);
    })(t0);
  });
}

    ctx.globalAlpha=1;

    if(phase==='aim'&&mine&&fl>=0&&fl<1){const e=Math.sin(fl*Math.PI);
      for(const d of discs)if(canPlay(d)){

let lastSecClock=-1,frameN=0,acc=0,prev=performance.now(),lastMin=-1,lastSec=-1;
function loop(t){
  acc+=Math.min(100,t-prev);prev=t;
  while(acc>=1000/60){
    if(phase==='moving'){
      step();
      if(ball.y<-ball.r&&Math.abs(ball.x-W/2)<GOAL/2){checkGoal('r')}
      else if(ball.y>H+ball.r&&Math.abs(ball.x-W/2)<GOAL/2){checkGoal('b')}
      else if(!moving())settle();
    }
    if(phase==='goal'&&goalRoll&&!(goalCel&&goalCel.t>=GC_BACK))stepBall(); // le ballon finit sa course dans le filet
    if(goalCel)goalCelStep();
    if(intro)introStep();
    if(match&&match.half&&!match.golden&&(phase==='aim'||phase==='moving')){
      match.left-=1000/60;const sc=Math.ceil(match.left/1000);
      if(sc!==lastSecClock){lastSecClock=sc;ui();if(sc<=5&&sc>0)sfx.tick(12)}
      if(match.left<=0&&phase==='aim')endHalf(); // le temps s'arrête quand le ballon est immobile
    }
    if(phase==='aim'&&!(cpu&&turn==='b')){
      turnT+=1000/60;const sec=Math.ceil((TURN_MS-turnT)/1000);
      if(sec!==lastSec){lastSec=sec;ui();if(sec<=3&&sec>0)sfx.tick(6)}
      if(turnT>=TURN_MS)timeUp();
    }
    if(celeb)animStep();
    if(crowdG&&((frameN=(frameN||0)+1)%15===0)){
      let lv=.05;
      if(phase==='menu')lv=.025;
      else if(phase==='goal'||celeb)lv=.12;
      else{const near=Math.min(ball.y,H-ball.y);lv=.05+(phase==='moving'?.08:.03)*Math.max(0,1-near/320)} // la tribune monte quand le ballon approche d'un but
      crowdLevel(lv);
      const near=Math.min(ball.y,H-ball.y)-(Math.abs(ball.x-W/2)>GOAL?60:0);
      crowdOh(phase==='moving'?Math.max(0,1-near/380):phase==='aim'?Math.max(0,1-near/300)*.35:0);
    }
    acc-=1000/60;
  }
  draw(t);requestAnimationFrame(loop);
}

  }catch(_){}
}
function clearLive(){try{localStorage.removeItem(LIVE_KEY)}catch(_){}}
function loadLive(){
  let L=null;try{L=JSON.parse(localStorage.getItem(LIVE_KEY))}catch(_){}
  if(!L||!L.discs||!L.match)return false;
  if((L.mode==='cup'&&!cup)||(L.mode==='cl'&&!cl)){clearLive();return false} // compétition abandonnée entre-temps
  ({discs,ball,score,turn,flicks,maxFlicks,kickoff,lastTouch,lastScorer,sixTurn,sixFresh,sixShot,kickShot,kickTouched,kickFoul,kickFresh,
    shotZone,shooter,lineRun,lineEnd,match,mode,cpu,flip,wx,stake,roofStyle,ballStyle}=L);
  S.r=L.S.r;S.b=L.S.b;lastShot=discs[L.lastShot]||null;
  drops=wx.rain?Array.from({length:90},()=>({x:Math.random()*(W+2*M)-M,y:Math.random()*(H+2*M)-M,s:9+Math.random()*6})):[];
  paused=L.ph;phase='menu';aim=null;intro=null;goalCel=null;celeb=null;shownTurn=turn;turnT=0;lastSecClock=-1;roofKey='';bgKey='';
  return true;
}
function leaveApp(){ // on quitte l'appli (ou l'onglet) : le match passe en pause
  if(phase==='aim'||phase==='moving'){paused=phase;phase='menu';aim=null;showHome();ui()}
  saveLive();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)leaveApp()});
addEventListener('pagehide',leaveApp);
setInterval(()=>{if(phase==='aim'||phase==='moving')saveLive()},3000); // filet de sécurité si l'appli est fermée brutalement

reset();resize();
if(loadLive()){showHome();if(wx.rain)try{rainSound(true)}catch(_){}}else showHome();
ui();requestAnimationFrame(loop);
})();
</script>
